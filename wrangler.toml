name = "glowfinder"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Static assets: the built frontend plus the pipeline artifacts (vite build -> public/).
# Requests that match a file never reach the Worker; only /api/* runs code.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"
remote = true

[[ratelimits]]
name = "LLM_LIMITER"
namespace_id = "2001"
  [ratelimits.simple]
  limit = 12
  period = 60

[[durable_objects.bindings]]
name = "NEURON_COUNTER"
class_name = "NeuronCounter"

# SQLite-backed Durable Objects are required on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NeuronCounter"]

[vars]
AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
NEURON_DAILY_BUDGET = "8000"
# Public site key of the managed "glowfinder" Turnstile widget (domains: the workers.dev
# hostname, localhost, 127.0.0.1). Its secret is the TURNSTILE_SECRET_KEY Worker secret.
TURNSTILE_SITE_KEY = "0x4AAAAAAFxbNSYjKx3gZuFa"
# Frontend hostnames siteverify must report (comma-separated). Production only: never localhost.
# .dev.vars overrides this for local development.
TURNSTILE_HOSTNAMES = "glowfinder.troche.workers.dev"

# Secrets (wrangler secret put ...): TURNSTILE_SECRET_KEY, SESSION_SIGNING_KEY.
# Without them the live LLM endpoints answer 503 and the app plays the recorded exemplar.
