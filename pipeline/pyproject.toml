[project]
name = "glowfinder-pipeline"
version = "1.0.0"
description = "Offline pipeline: Sarkisyan 2016 GFP landscape -> glowfinder runtime artifacts"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "requests>=2.31",
    "torch>=2.2",
    "transformers>=4.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[project.scripts]
glowfinder-pipeline = "glowfinder_pipeline.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glowfinder_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the ESM-2 model download"]
